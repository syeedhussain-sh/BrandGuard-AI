services:
  - type: web
    name: brandguard-ai
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev --prefix "Brandguard AI-Engine Analysis/BrandGuard-Analysis" && npm install --include=dev --prefix "Brand Guard AI-Backend/backend" && npm install --include=dev --prefix "Brandguard AI - Fe/frontend" && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        value: "*"
